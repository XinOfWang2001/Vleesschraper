spring.application.name=service_api
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:53000/meat_api
spring.datasource.username=meat_api
spring.datasource.password=local_analytics_password

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:service-api}
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topic=${KAFKA_MEAT_PRICE_TOPIC:new_meat}

spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true